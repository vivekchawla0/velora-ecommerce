# Template for Kubernetes Secret
# In production, base64 encode your secrets or use AWS Secrets Manager / SealedSecrets
# Example: echo -n "your_secret" | base64
apiVersion: v1
kind: Secret
metadata:
  name: nexacart-secrets
  namespace: nexacart
type: Opaque
stringData:
  JWT_SECRET: "your_super_secure_jwt_secret_for_production_use"
  JWT_EXPIRE: "7d"
