name: NexaCart CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run Backend Integration & Unit Tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_12345
        run: npm test

  test-recommender:
    name: ML Recommendation Service Tests & Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: recommendation-service/requirements.txt

      - name: Install Python Dependencies
        working-directory: recommendation-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        working-directory: recommendation-service
        run: pytest

      - name: Run Recommendation Evaluation Pipeline (Precision@5 & Recall@5)
        working-directory: recommendation-service
        run: python evaluate.py

  build-frontend:
    name: Frontend Build & Bundle Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Images Build Verification
    needs: [test-backend, test-recommender, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: nexacart-backend:ci

      - name: Build Recommendation Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./recommendation-service
          push: false
          tags: nexacart-recommendation:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: nexacart-frontend:ci
